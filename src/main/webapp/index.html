<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f6f8;
        }

        .container {
            background: white;
            width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        .success {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        .tools {
            margin-top: 25px;
            line-height: 1.8;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 DevOps CI/CD Application</h1>

        <p class="success">Application deployed successfully!</p>

        <div class="tools">
            <p><strong>Git:</strong> GitHub</p>
            <p><strong>CI:</strong> Jenkins</p>
            <p><strong>Code Quality:</strong> SonarQube</p>
            <p><strong>Build:</strong> Maven</p>
            <p><strong>Artifact:</strong> Artifact Repository</p>
            <p><strong>Container:</strong> Docker</p>
            <p><strong>Security:</strong> Trivy</p>
            <p><strong>CD:</strong> Argo CD</p>
            <p><strong>Platform:</strong> Kubernetes</p>
        </div>

    </div>

</body>
</html>
